<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f4eadf" />
  <meta name="description" content="Charlie PLC — one long-term position available." />
  <title>Charlie PLC</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="paper-noise" aria-hidden="true"></div>

  <header class="topbar" id="topbar">
    <button class="brand-button" id="brandButton" type="button" aria-label="Back to start">
      <span class="brand-mark">CHRL</span>
      <span class="brand-status"><i></i> Available</span>
    </button>
    <div class="progress-wrap" aria-label="Website progress">
      <div class="progress-track"><span id="progressBar"></span></div>
      <span class="progress-label" id="progressLabel">01 / 08</span>
    </div>
  </header>

  <main id="app" class="app" aria-live="polite"></main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="./data/config.js"></script>
  <script src="./data/content.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
